name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: Code-Qualität (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@v5

      - name: PHP ${{ matrix.php-version }} einrichten
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: mbstring, xml, ctype, iconv, intl, pdo, pdo_mysql, curl, zip
          tools: composer:v2

      - name: Composer-Cache laden
        uses: actions/cache@v5
        with:
          path: vendor
          key: ${{ runner.os }}-php${{ matrix.php-version }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-php${{ matrix.php-version }}-composer-

      - name: Abhängigkeiten installieren
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Security-Audit
        run: composer audit

      - name: Code-Style prüfen
        run: composer cs-check

      - name: Statische Analyse (PHPStan Level 8)
        run: composer phpstan

      - name: Tests ausführen
        run: composer test
